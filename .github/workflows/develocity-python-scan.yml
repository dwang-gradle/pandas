name: Develocity Python Scan

# Builds pandas and runs a real pandas test slice under the official Develocity
# Python agent, with Develocity Artifact Cache RESTORE + STORE enabled for pip
# (Step 5: partial cache hit — one dependency version changed; expect only the
# changed dependency downloaded and stored). Publishes Build Scans to
# https://dv-helm-cluster-unstable-release.grdev.net. Manually triggered.
#
# Requires repo secret DEVELOCITY_ACCESS_KEY = dv-helm-cluster-unstable-release.grdev.net=<key>
on:
  workflow_dispatch:

permissions: {}

env:
  DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
  DEVELOCITY_URL: https://dv-helm-cluster-unstable-release.grdev.net
  # Shared pip cache dir: Artifact Cache restores into it, pip installs from it,
  # and the agent reads restore metrics from it (see .develocity.py).
  PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache
  DVAC_CLI_VERSION: "1.5.0"

jobs:
  build-and-scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (required by the Artifact Cache CLI)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Develocity Artifact Cache CLI
        run: |
          curl -sfL -o dvac-cli.jar \
            "https://docs.gradle.com/downloads/develocity-artifact-cache-cli/develocity-artifact-cache-cli-${DVAC_CLI_VERSION}.jar"

      - name: Artifact Cache restore (pip)
        # Restore before the pip installs. Also sets up the pip download journal
        # that the store step (end of job) uses to know which artifacts to cache.
        # continue-on-error so the scan still publishes even if AC restore has issues.
        continue-on-error: true
        run: |
          mkdir -p "$PIP_CACHE_DIR"
          java -jar dvac-cli.jar restore \
            --dv-server=https://dv-helm-cluster-unstable-release.grdev.net \
            --image-name=pandas-ac-navigator \
            --autodetect=PIP \
            --pip-home="$PIP_CACHE_DIR" \
            --verbose

      - name: Create venv + install build/test deps + Develocity agent
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/pip install --upgrade pip
          .ci-venv/bin/pip install "meson-python>=0.19,<1" "meson>=1.2.3,<2" wheel \
            "Cython>3.1.0,<4" "numpy>=2.0,!=2.5.0" "versioneer[toml]" ninja
          .ci-venv/bin/pip install pytest hypothesis pytz==2024.1 python-dateutil tzdata pyarrow
          .ci-venv/bin/pip install \
            https://develocity-python-pkgs.gradle.com/develocity_agent-0.10.1-py3-none-any.whl

      - name: Build pandas (editable, compiles Cython/C)
        # This fork has no tags, so give versioneer a real version (otherwise
        # pyarrow's version check warns and pandas' strict config makes it fatal).
        run: |
          git tag -f v3.0.0.dev0
          PATH="$PWD/.ci-venv/bin:$PATH" .ci-venv/bin/pip install -e . --no-build-isolation

      - name: Run a real pandas test slice (agent auto-publishes a Build Scan)
        run: .ci-venv/bin/pytest pandas/tests/test_flags.py -v

      - name: Artifact Cache store (pip)
        # Step 5 partial hit: most artifacts restored; the store persists only the
        # newly-downloaded (changed) dependency's files.
        run: |
          java -jar dvac-cli.jar store \
            --dv-server=https://dv-helm-cluster-unstable-release.grdev.net \
            --image-name=pandas-ac-navigator \
            --autodetect=PIP \
            --pip-home="$PIP_CACHE_DIR" \
            --verbose
